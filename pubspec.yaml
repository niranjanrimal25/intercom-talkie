name: intercom_talkie
description: >-
  Offline peer-to-peer intercom. Bridges two Bluetooth intercoms through two
  phones over a local Wi-Fi hotspot using WebRTC. No internet, no cell towers
  required.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # WebRTC media engine: capture, Opus codec, echo cancellation, jitter buffer
  # and adaptive streaming. Pinned to the reviewed release line.
  flutter_webrtc: ">=1.6.2 <1.7.0"

  # Runtime permission requests (microphone, bluetooth, notifications).
  permission_handler: ^13.0.2

  # Tiny key/value persistence for settings (device name, last host, ...).
  shared_preferences: ^2.5.5

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
