name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to the exact Flutter revision that generated this project
  # (flutter 3.47.5, stable, 2026-09-17) so Gradle/AGP/Kotlin templates match.
  FLUTTER_SHA: 6a19cca56475dbfba1478ee68d7bd0c2ef891da1

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Flutter
        run: |
          git init "$RUNNER_TEMP/flutter"
          cd "$RUNNER_TEMP/flutter"
          git remote add origin https://github.com/flutter/flutter.git
          git fetch --depth 1 origin "$FLUTTER_SHA"
          git checkout FETCH_HEAD
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --reporter expanded

  android-apk:
    name: Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned Flutter
        run: |
          git init "$RUNNER_TEMP/flutter"
          cd "$RUNNER_TEMP/flutter"
          git remote add origin https://github.com/flutter/flutter.git
          git fetch --depth 1 origin "$FLUTTER_SHA"
          git checkout FETCH_HEAD
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Pub get
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: intercom-talkie-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios-compile:
    name: iOS compile check
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Flutter
        run: |
          git init "$RUNNER_TEMP/flutter"
          cd "$RUNNER_TEMP/flutter"
          git remote add origin https://github.com/flutter/flutter.git
          git fetch --depth 1 origin "$FLUTTER_SHA"
          git checkout FETCH_HEAD
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Pub get
        run: flutter pub get

      - name: Build iOS (compile check, no codesign)
        run: flutter build ios --release --no-codesign
